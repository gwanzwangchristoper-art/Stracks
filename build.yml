name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Find the app (a .zip upload or loose files both work)
        run: |
          if [ -f package.json ]; then
            APP="$PWD"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No .zip file found. Upload sales-track.zip to the main page of this repository."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/unpacked"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/unpacked"
            PKG=$(find "$RUNNER_TEMP/unpacked" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$PKG" ]; then
              echo "::error::package.json was not found inside $ZIP"
              exit 1
            fi
            APP=$(dirname "$PKG")
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App folder: $APP"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: cd "$APP" && npm install --no-audit --no-fund

      - name: Self-check (a problem here does not stop the build)
        continue-on-error: true
        run: cd "$APP" && npm test

      - name: Build the web app
        run: cd "$APP" && npm run build

      - name: Create and prepare the Android project
        run: |
          cd "$APP"
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        run: |
          cd "$APP/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp "$APP/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/SalesTrack.apk"

      - name: Keep a copy on this page
        uses: actions/upload-artifact@v4
        with:
          name: SalesTrack-apk
          path: SalesTrack.apk

      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SalesTrack.apk --title "Sales Track build ${{ github.run_number }}" --notes "Download SalesTrack.apk below and open it on your phone to install." --latest \
            || gh release upload "$TAG" SalesTrack.apk --clobber
